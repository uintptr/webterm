<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xterm-web</title>
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<style>
  :root {
    --bg: #000000;
    --bar: #111111;
    --tab: #1c1c1c;
    --tab-active: #000000;
    --fg: #e5e5e5;
    --muted: #8a8a8a;
    --tab-fg: #6a6a6a;
    --accent: #4f8cc9;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }

  #bar { display: flex; align-items: stretch; background: var(--bar); height: 34px;
    border-bottom: 1px solid #000; overflow-x: auto; flex: none; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px;
    background: var(--tab); color: var(--tab-fg); border-right: 1px solid #000;
    cursor: pointer; user-select: none; white-space: nowrap; max-width: 220px; }
  .tab.active { background: var(--tab-active); color: var(--fg); box-shadow: inset 0 2px var(--accent); }
  /* A tab's own colour, set from the right-click menu: a tint plus the top line. */
  .tab.colored { background: color-mix(in srgb, var(--tab-color) 22%, var(--tab));
    box-shadow: inset 0 3px var(--tab-color); }
  .tab.colored.active { background: color-mix(in srgb, var(--tab-color) 45%, var(--tab-active)); color: #fff; }
  .tab[hidden] { display: none; }
  .tab.dragging { opacity: .6; }
  /* Nested tabs: an arrow folds a tab's children away. Across the top, children are
     marked with a › instead of being indented. */
  .tab .twisty { flex: none; width: 14px; margin-right: -4px; border: 0; padding: 0; background: none;
    color: inherit; font-size: 10px; line-height: 1; cursor: pointer; opacity: .7; }
  .tab .twisty:hover { opacity: 1; }
  .tab:not(.parent) .twisty { display: none; }
  .tab .count { flex: none; color: var(--muted); font-size: 11px; }
  .tab .count:empty { display: none; }
  .tab.child { padding-left: 8px; }
  .tab.child .label::before { content: "› "; opacity: .5; }
  /* Where a dragged tab will land: a line before or after a tab, or a box to go inside it. */
  .tab { position: relative; }
  .tab.drop-before::after, .tab.drop-after::after { content: ""; position: absolute; top: 0; bottom: 0;
    width: 2px; background: var(--accent); pointer-events: none; }
  .tab.drop-before::after { left: 0; }
  .tab.drop-after::after { right: 0; }
  .tab.drop-into { outline: 2px dashed var(--accent); outline-offset: -2px; }
  body.dragging-tab, body.dragging-tab * { cursor: grabbing !important; }
  .tab .label { overflow: hidden; text-overflow: ellipsis; }
  .tab .close { border: 0; background: none; color: inherit; font-size: 14px; line-height: 1;
    padding: 2px 4px; border-radius: 4px; cursor: pointer; opacity: .6; }
  .tab .close:hover { opacity: 1; background: #ffffff1a; }
  .tab input { width: 120px; font: inherit; color: var(--fg); background: #000;
    border: 1px solid var(--accent); border-radius: 3px; padding: 1px 4px; }
  #new { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 12px; cursor: pointer; }
  #new:hover { color: var(--fg); }
  #colors { position: fixed; z-index: 10; display: flex; gap: 6px; padding: 6px;
    background: var(--bar); border: 1px solid #333; border-radius: 6px; box-shadow: 0 4px 12px #000a; }
  #colors[hidden] { display: none; }
  #colors button { width: 18px; height: 18px; padding: 0; border: 1px solid #ffffff33;
    border-radius: 50%; background: var(--swatch); cursor: pointer; }
  #colors button:hover { outline: 2px solid var(--fg); outline-offset: 1px; }
  #colors { flex-wrap: wrap; max-width: 320px; }
  #colors .actions { flex-basis: 100%; display: flex; gap: 4px; padding-top: 6px; border-top: 1px solid #333; }
  #colors .actions button { width: auto; height: auto; padding: 3px 8px; border: 1px solid #333;
    border-radius: 4px; background: var(--tab); color: var(--fg); font: inherit; font-size: 12px; }
  #colors .actions button:hover { outline: 0; background: #2a2a2a; }
  #colors .actions button:disabled { opacity: .4; cursor: default; }
  #colors button.none { background: linear-gradient(135deg, transparent 45%, #e55 45% 55%, transparent 55%), var(--tab); }
  dialog { padding: 0; color: var(--fg); background: var(--bar); border: 1px solid #333;
    border-radius: 8px; box-shadow: 0 8px 24px #000c; max-width: min(360px, 90vw); }
  dialog::backdrop { background: #0008; }
  dialog form { padding: 16px; }
  dialog p { margin: 0 0 16px; line-height: 1.4; overflow-wrap: anywhere; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; }
  dialog button { font: inherit; color: var(--fg); background: var(--tab); border: 1px solid #333;
    border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  dialog button:hover { background: #2a2a2a; }
  dialog button.danger { background: #b33a35; border-color: #b33a35; color: #fff; }
  dialog button.danger:hover { background: #c94641; }
  dialog :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #settings h2 { margin: 0 0 4px; font-size: 15px; }
  #settings p { color: var(--muted); font-size: 12px; }
  #settings label { display: flex; align-items: center; justify-content: space-between; gap: 24px;
    margin: 0 0 12px; }
  #settings select, #settings input { font: inherit; color: var(--fg); background: #000;
    border: 1px solid #333; border-radius: 4px; padding: 3px 6px; width: 90px;
    box-sizing: border-box; }
  #status { margin-left: auto; align-self: center; padding: 0 12px; color: var(--muted); white-space: nowrap; }
  #info { display: flex; align-items: center; flex: none; }
  #commit { padding: 0 4px 0 0; color: var(--muted); white-space: nowrap;
    font: 11px Menlo, "SF Mono", Monaco, monospace; }
  /* An SVG rather than ⚙: the glyph comes from whatever fallback font the system has,
     whose metrics put it off the hash's centre line. */
  #gear { display: flex; align-items: center; border: 0; background: none; color: var(--muted);
    padding: 0 10px 0 4px; cursor: pointer; align-self: stretch; }
  #gear svg { width: 14px; height: 14px; fill: currentColor; }
  #gear:hover { color: var(--fg); }

  /* Tabs down the left side instead of across the top. */
  body.tabs-left { flex-direction: row; }
  body.tabs-left #bar { flex-direction: column; width: 180px; height: auto; overflow: hidden auto;
    border-bottom: 0; border-right: 1px solid #000; }
  body.tabs-left .tab { flex: none; min-height: 30px; max-width: none; border-right: 0;
    border-bottom: 1px solid #000; }
  body.tabs-left .tab .label { flex: 1; }
  body.tabs-left .tab { padding-left: calc(4px + var(--depth, 0) * 14px); }
  body.tabs-left .tab:not(.parent) .twisty { display: block; visibility: hidden; }
  body.tabs-left .tab.child .label::before { content: none; }
  body.tabs-left .tab.drop-before::after, body.tabs-left .tab.drop-after::after {
    left: calc(4px + var(--drop-depth, var(--depth, 0)) * 14px); right: 0; width: auto; height: 2px; }
  body.tabs-left .tab.drop-before::after { top: 0; bottom: auto; }
  body.tabs-left .tab.drop-after::after { top: auto; bottom: 0; }
  body.tabs-left .tab.active { box-shadow: inset 2px 0 var(--accent); }
  body.tabs-left .tab.colored { box-shadow: inset 3px 0 var(--tab-color); }
  body.tabs-left #new { flex: none; padding: 4px 12px; text-align: left; }
  body.tabs-left #status { margin: auto 0 0; align-self: stretch; white-space: normal; }
  body.tabs-left #status:not(:empty) { padding: 6px 12px; }
  body.tabs-left #info { justify-content: space-between; min-height: 30px; padding-left: 12px;
    border-top: 1px solid #000; }

  #terms { flex: 1; position: relative; min-height: 0; }
  /* The frame is always there, so colouring a tab never changes the terminal's size. */
  .term { position: absolute; inset: 0; padding: 4px 0 0 6px; border: 3px solid transparent;
    touch-action: none; }
  .term.colored { border-color: var(--tab-color); }
  .term[hidden] { display: none; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div id="bar">
  <button id="new" title="New tab (Alt+Shift+T)">+</button>
  <span id="status"></span>
  <div id="info">
    <span id="commit" hidden></span>
    <button id="gear" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M13.06 6.43L14.90 6.82L14.90 9.18L13.06 9.57L12.69 10.47L13.72 12.04L12.04 13.72L10.47 12.69L9.57 13.06L9.18 14.90L6.82 14.90L6.43 13.06L5.53 12.69L3.96 13.72L2.28 12.04L3.31 10.47L2.94 9.57L1.10 9.18L1.10 6.82L2.94 6.43L3.31 5.53L2.28 3.96L3.96 2.28L5.53 3.31L6.43 2.94L6.82 1.10L9.18 1.10L9.57 2.94L10.47 3.31L12.04 2.28L13.72 3.96L12.69 5.53ZM10.4 8a2.4 2.4 0 1 0-4.8 0 2.4 2.4 0 1 0 4.8 0Z"/></svg></button>
  </div>
</div>
<div id="colors" hidden></div>
<dialog id="confirm">
  <form method="dialog">
    <p></p>
    <div class="buttons">
      <button value="">Cancel</button>
      <button value="ok" class="danger">Close tab</button>
    </div>
  </form>
</dialog>
<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <p>Saved in this browser only.</p>
    <label>Tab bar
      <select name="tabs"><option value="top">Top</option><option value="left">Left</option></select>
    </label>
    <label>Font size
      <input name="fontSize" type="number" min="8" max="32" step="1">
    </label>
    <div class="buttons"><button value="ok">Done</button></div>
  </form>
</dialog>
<div id="terms"><div id="empty" hidden>No tabs. Press + to open one.</div></div>

<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/addon-fit/lib/addon-fit.js"></script>
<script src="/vendor/addon-unicode11/lib/addon-unicode11.js"></script>
<script>
const bar = document.getElementById('bar');
const newBtn = document.getElementById('new');
const terms = document.getElementById('terms');
const empty = document.getElementById('empty');
const statusEl = document.getElementById('status');
const commitEl = document.getElementById('commit');
const colorMenu = document.getElementById('colors');
const confirmDlg = document.getElementById('confirm');
const settingsDlg = document.getElementById('settings');
const gearBtn = document.getElementById('gear');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const COLORS = ['#e5534b', '#e0823d', '#d4b83a', '#9cbf3b', '#57ab5a', '#3fb39a',
                '#39c5cf', '#4f8cc9', '#6c6fdc', '#986ee2', '#d55fb4', '#e06c8c'];

// Per-browser preferences: tabs are shared by every browser, but where the tab bar
// goes and how big the text is depend on the screen in front of you.
const SETTINGS_KEY = 'xterm-web.settings';
// Phones default to the bar on top, since a sidebar takes too much of a narrow screen.
// Judged by the screen's short side, so turning the phone doesn't flip it; tablets
// are wider than 600px and keep the sidebar.
const isPhone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
const DEFAULTS = { tabs: isPhone ? 'top' : 'left', fontSize: 13 };
let settings = loadSettings();

function loadSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch {}
  return {
    tabs: s.tabs === 'top' || s.tabs === 'left' ? s.tabs : DEFAULTS.tabs,
    fontSize: Number.isInteger(s.fontSize) && s.fontSize >= 8 && s.fontSize <= 32 ? s.fontSize : DEFAULTS.fontSize,
  };
}

function applySettings() {
  document.body.classList.toggle('tabs-left', settings.tabs === 'left');
  for (const t of tabs.values()) if (t.term) t.term.options.fontSize = settings.fontSize;
  // Hidden terminals are fitted when they are next shown.
  const t = activeId && tabs.get(activeId);
  t?.fit?.fit();
}

function openSettings() {
  const f = settingsDlg.querySelector('form');
  f.tabs.value = settings.tabs;
  f.fontSize.value = settings.fontSize;
  settingsDlg.showModal();
}

function changeSetting(e) {
  const { name, value } = e.target;
  if (name === 'tabs') settings.tabs = value;
  if (name === 'fontSize') {
    const n = Number(value);
    if (!Number.isInteger(n) || n < 8 || n > 32) return;  // mid-edit, e.g. "1" on the way to "14"
    settings.fontSize = n;
  }
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
  applySettings();
}

// id -> { id, name, color, parent, tabEl, pane, term, fit, ws, retry }
const tabs = new Map();
// Depth first: every tab comes after its parent, followed by its own children.
let order = [];
// Tabs whose children are folded away, kept per browser like the settings.
const COLLAPSED_KEY = 'xterm-web.collapsed';
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem(COLLAPSED_KEY)) || []); } catch {}
function saveCollapsed() {
  try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify([...collapsed])); } catch {}
}
function isUnder(id, ancestor) {
  for (let p = tabs.get(id)?.parent; p; p = tabs.get(p)?.parent) if (p === ancestor) return true;
  return false;
}
function depth(id) {
  let n = 0;
  for (let p = tabs.get(id)?.parent; p && tabs.has(p); p = tabs.get(p).parent) n++;
  return n;
}
// A tab and everything nested in it: a run of `order`, since it is depth first.
function subtree(id) {
  const i = order.indexOf(id);
  if (i < 0) return [];
  let j = i + 1;
  while (j < order.length && isUnder(order[j], id)) j++;
  return order.slice(i, j);
}
const hasChildren = id => order.some(x => tabs.get(x).parent === id);
const isHidden = id => {
  for (let p = tabs.get(id)?.parent; p; p = tabs.get(p)?.parent) if (collapsed.has(p)) return true;
  return false;
};
const visibleOrder = () => order.filter(id => !isHidden(id));
const siblings = id => order.filter(x => tabs.get(x).parent === tabs.get(id).parent);
let activeId = null;
// Bumped on every local reorder, so a sync() that was already in flight when the
// tabs moved doesn't put back the old order.
let orderVersion = 0;
let dragging = false;
// The host the page was reached by, so the window title says which machine this is:
// lcmac.uintptr.ca -> lcmac. An IP address is kept whole.
const hostname = /^[\d.]+$|:/.test(location.hostname)
  ? location.hostname
  : location.hostname.split('.')[0];

const api = (path, opts = {}) =>
  fetch('/api/tabs' + path, { headers: { 'Content-Type': 'application/json' }, ...opts })
    .then(r => {
      if (!r.ok) throw new Error(r.status);
      const commit = r.headers.get('X-Commit');
      if (commit !== null) {
        // The page is the checkout's; X-Running is set when server.py needs a restart.
        const running = r.headers.get('X-Running');
        commitEl.textContent = running ? `${commit} *` : commit;
        commitEl.title = running
          ? `Checkout is at ${commit}, but the server is still running ${running}: restart it to pick up server.py`
          : 'Commit the page and server are running';
        commitEl.hidden = !commit;
      }
      return r.json();
    });

// A nested tab the user hasn't given a colour shows its parent's, so a group of tabs
// reads as one. Otherwise a tab the user hasn't given a colour takes one from its name. If another tab
// already shows that colour it takes the next free one, so tabs only share a colour
// once the palette runs out. Colours the user picked are claimed first, then the
// rest in creation order (ids are timestamps), so a tab keeps its colour when tabs
// are moved or opened after it. Tabs with the same name share a colour. Unnamed tabs
// stay plain: "Tab 3" changes as tabs move.
function tabColors() {
  // How each tab gets its colour; parents come first in `order`, so theirs is known.
  const how = new Map();
  for (const id of order) {
    const t = tabs.get(id);
    how.set(id, t.color ? 'own' : how.get(t.parent) ? 'parent' : t.name ? 'name' : '');
  }
  const auto = autoColors([...tabs.values()].filter(t => how.get(t.id) === 'name'));
  const colors = new Map();
  for (const id of order) {
    const t = tabs.get(id);
    const h = how.get(id);
    colors.set(id, h === 'own' ? t.color : h === 'parent' ? colors.get(t.parent) : auto.get(id) || '');
  }
  return colors;
}
function autoColors(named) {
  const colors = new Map();
  const used = new Set([...tabs.values()].map(t => t.color).filter(Boolean));
  const byName = new Map();
  const auto = named.sort((a, b) => a.id < b.id ? -1 : 1);
  for (const t of auto) {
    if (!byName.has(t.name)) {
      let h = 0x811c9dc5;  // FNV-1a
      for (const ch of t.name) h = Math.imul(h ^ ch.codePointAt(0), 0x01000193);
      const start = (h >>> 0) % COLORS.length;
      let color = COLORS[start];
      for (let i = 0; i < COLORS.length; i++) {
        const c = COLORS[(start + i) % COLORS.length];
        if (!used.has(c)) { color = c; break; }
      }
      used.add(color);
      byName.set(t.name, color);
    }
    colors.set(t.id, byName.get(t.name));
  }
  return colors;
}

function label(t) {
  return t.name || `Tab ${order.indexOf(t.id) + 1}`;
}

function renderBar() {
  // Move a tab only when it is out of place: re-inserting a node blurs whatever is
  // focused inside it, which would end a rename every time sync() runs.
  let prev = null;
  const colors = tabColors();
  for (const id of order) {
    const t = tabs.get(id);
    const slot = prev ? prev.nextSibling : bar.firstChild;
    if (t.tabEl !== slot) bar.insertBefore(t.tabEl, slot);
    prev = t.tabEl;
    t.tabEl.classList.toggle('active', id === activeId);
    const parent = hasChildren(id);
    const folded = parent && collapsed.has(id);
    t.tabEl.classList.toggle('parent', parent);
    t.tabEl.classList.toggle('child', !!t.parent);
    t.tabEl.style.setProperty('--depth', depth(id));
    t.tabEl.hidden = isHidden(id);
    const twisty = t.tabEl.querySelector('.twisty');
    twisty.textContent = folded ? '▸' : '▾';
    twisty.title = folded ? 'Show the tabs nested in this one' : 'Hide the tabs nested in this one';
    t.tabEl.querySelector('.count').textContent = folded ? subtree(id).length - 1 : '';
    const lab = t.tabEl.querySelector('.label');
    if (lab) lab.textContent = label(t);
    const color = colors.get(id) || '';
    for (const el of [t.tabEl, t.pane]) {
      el.classList.toggle('colored', !!color);
      if (color) el.style.setProperty('--tab-color', color);
    }
  }
  empty.hidden = order.length > 0;
  const active = tabs.get(activeId);
  const title = active ? label(active) : 'xterm-web';
  document.title = hostname ? `${hostname} ${title}` : title;
}

function makeTab({ id, name, color, parent }) {
  const t = { id, name, color, parent: parent || '', term: null };
  const el = document.createElement('div');
  el.className = 'tab';
  el.title = 'Drag to move (onto a tab to nest it), double-click to rename, right-click for colour and nesting';
  el.innerHTML = '<button class="twisty"></button><span class="label"></span><span class="count"></span>' +
    '<button class="close" title="Close tab (Alt+Shift+W)">×</button>';
  el.addEventListener('click', e => { if (!e.target.closest('.close, .twisty, input')) activate(id); });
  el.querySelector('.close').addEventListener('click', () => closeTab(id));
  el.querySelector('.twisty').addEventListener('click', () => toggleCollapse(id));
  el.addEventListener('dblclick', e => { if (!e.target.closest('.close, .twisty')) startRename(t); });
  el.addEventListener('pointerdown', e => dragTab(t, e));
  el.addEventListener('contextmenu', e => { e.preventDefault(); openColors(t); });
  t.tabEl = el;
  t.pane = document.createElement('div');
  t.pane.className = 'term';
  t.pane.hidden = true;
  terms.appendChild(t.pane);
  tabs.set(id, t);
  return t;
}

// Terminals are created on first view and kept alive while hidden, so switching
// tabs keeps their scrollback for as long as the page is open.
function ensureTerm(t) {
  if (t.term) return;
  t.term = new Terminal({
    cursorBlink: true,
    macOptionIsMeta: true,
    scrollback: 10000,
    fontFamily: 'Menlo, "SF Mono", Monaco, monospace',
    fontSize: settings.fontSize,
    theme: { background: css('--bg'), foreground: css('--fg') },
    allowProposedApi: true,  // term.unicode, needed by the Unicode 11 addon
  });
  t.fit = new FitAddon.FitAddon();
  t.term.loadAddon(t.fit);
  // The default Unicode 6 tables make emoji one cell wide, so only their left half shows.
  // Guarded so a checkout that hasn't re-run npm since this addon was added still works.
  if (window.Unicode11Addon) {
    t.term.loadAddon(new Unicode11Addon.Unicode11Addon());
    t.term.unicode.activeVersion = '11';
  }
  t.term.open(t.pane);
  t.term.attachCustomKeyEventHandler(e => shortcut(e) && optionSymbol(t, e));
  t.term.onData(d => send(t, new TextEncoder().encode(d)));
  t.term.onBinary(d => send(t, Uint8Array.from(d, c => c.charCodeAt(0))));
  t.term.onResize(({ cols, rows }) => sendResize(t, cols, rows));
  // Copy on select. Done on mouseup rather than onSelectionChange: the fallback in
  // copyText only works while the browser still counts the click as user activation.
  // The mouseup is caught on the document, as xterm does, because a drag often ends
  // outside the pane: past its right edge for whole lines, below it to scroll, or off
  // the window. The mousedown is caught in the capture phase because a Shift-drag in
  // an app with mouse reporting (vim, tmux) stops it before it bubbles to the pane.
  t.pane.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    document.addEventListener('mouseup', () => {
      if (t.term?.hasSelection()) copyText(t, t.term.getSelection());
    }, { once: true });
  }, true);
  touchScroll(t);
  connect(t);
}

// xterm.js 6 does not scroll on touch, so turn a one-finger vertical swipe into
// scrolling: scrollback on the normal screen, and wheel events on the alternate
// one, which xterm sends on as mouse reports or arrow keys like a real wheel.
function touchScroll(t) {
  const screen = t.pane.querySelector('.xterm-screen');
  let lastY = null, acc = 0;
  t.pane.addEventListener('touchstart', e => {
    lastY = e.touches.length === 1 ? e.touches[0].clientY : null;
    acc = 0;
  }, { passive: true });
  t.pane.addEventListener('touchmove', e => {
    if (lastY === null || e.touches.length !== 1) return;
    const { clientX, clientY } = e.touches[0];
    acc += lastY - clientY;
    lastY = clientY;
    const rowH = screen.clientHeight / t.term.rows;
    const n = Math.trunc(acc / rowH);
    if (!n) return;
    acc -= n * rowH;
    e.preventDefault();
    if (t.term.buffer.active.type === 'normal') { t.term.scrollLines(n); return; }
    for (let i = 0; i < Math.abs(n); i++) {
      screen.dispatchEvent(new WheelEvent('wheel', {
        deltaY: Math.sign(n) * rowH, deltaMode: 0, clientX, clientY, bubbles: true, cancelable: true,
      }));
    }
  }, { passive: false });
  t.pane.addEventListener('touchend', () => { lastY = null; });
}

function send(t, bytes) {
  if (t.ws?.readyState === WebSocket.OPEN) t.ws.send(bytes);
}

function sendResize(t, cols, rows) {
  if (t.ws?.readyState === WebSocket.OPEN) t.ws.send(JSON.stringify({ type: 'resize', cols, rows }));
}

function connect(t) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/${t.id}`);
  ws.binaryType = 'arraybuffer';
  t.ws = ws;
  ws.onopen = () => {
    t.retry = 0;
    // The server replays the tab's recent output first; start from a clean screen.
    t.term.reset();
    if (t.id === activeId) {
      t.fit.fit();
      sendResize(t, t.term.cols, t.term.rows);
    }
  };
  ws.onmessage = e => t.term.write(new Uint8Array(e.data));
  ws.onclose = e => {
    if (t.ws !== ws || !tabs.has(t.id)) return;
    if (e.code === 4000) { removeTab(t.id); return; }  // shell exited
    // Server restarted or the network dropped: the dtach session is still there.
    t.term.write('\r\n\x1b[2m[disconnected, reconnecting…]\x1b[0m\r\n');
    t.retry = Math.min((t.retry || 0) + 1, 5);
    setTimeout(() => tabs.has(t.id) && connect(t), 500 * t.retry);
  };
}

function activate(id) {
  if (!tabs.has(id)) return;
  // Unfold whatever the tab is nested in, so the active tab is always in view.
  for (let p = tabs.get(id).parent; p; p = tabs.get(p)?.parent) if (collapsed.delete(p)) saveCollapsed();
  activeId = id;
  for (const t of tabs.values()) t.pane.hidden = t.id !== id;
  const t = tabs.get(id);
  ensureTerm(t);
  t.fit.fit();
  // Every browser shares one pty per tab, so the one looking at it claims its size.
  sendResize(t, t.term.cols, t.term.rows);
  t.term.focus();
  renderBar();
  try { localStorage.setItem('xterm-web.active', id); } catch {}
}

function removeTab(id) {
  const t = tabs.get(id);
  if (!t) return;
  // Its children move up into its place, as the server does.
  for (const x of tabs.values()) if (x.parent === id) x.parent = t.parent;
  if (collapsed.delete(id)) saveCollapsed();
  tabs.delete(id);
  const idx = order.indexOf(id);
  order = order.filter(x => x !== id);
  t.ws?.close();
  t.term?.dispose();
  t.pane.remove();
  t.tabEl.remove();
  if (activeId === id) {
    activeId = null;
    const next = order.slice(idx).find(x => !isHidden(x)) ?? order.slice(0, idx).reverse().find(x => !isHidden(x));
    if (next) activate(next);
  }
  renderBar();
}

// Opens a tab at the end, or as the last tab nested in `parent`.
async function newTab(parent = '') {
  const info = await api('', { method: 'POST', body: JSON.stringify(parent ? { parent } : {}) });
  const t = makeTab(info);
  if (!tabs.has(t.parent)) t.parent = '';  // a server from before nested tabs
  if (t.parent) {
    const sub = subtree(t.parent);
    order.splice(order.indexOf(sub[sub.length - 1]) + 1, 0, t.id);
    orderVersion++;
  } else {
    order.push(t.id);
  }
  activate(t.id);
}

function toggleCollapse(id) {
  if (collapsed.has(id)) collapsed.delete(id);
  else collapsed.add(id);
  saveCollapsed();
  // Folding away the active tab makes the tab it is folded into the active one.
  if (activeId && isHidden(activeId)) activate(id);
  renderBar();
  tabs.get(activeId)?.term?.focus();
}

// `ids` put depth first by the tabs' parents, keeping siblings in the order given.
function treeOrder(ids) {
  const kids = new Map(), out = [], seen = new Set();
  const set = new Set(ids);
  for (const id of ids) {
    const p = set.has(tabs.get(id).parent) ? tabs.get(id).parent : '';
    if (!kids.has(p)) kids.set(p, []);
    kids.get(p).push(id);
  }
  const add = id => {
    if (seen.has(id)) return;
    seen.add(id);
    out.push(id);
    for (const k of kids.get(id) || []) add(k);
  };
  for (const id of kids.get('') || []) add(id);
  // Only a loop of parents never reaches the top: break it.
  for (const id of ids) if (!seen.has(id)) { tabs.get(id).parent = ''; add(id); }
  return out;
}

// Closing a tab ends its shell, so ask first. Enter confirms, Escape or a click
// outside the box cancels.
function confirmClose(t) {
  if (confirmDlg.open) return Promise.resolve(false);
  confirmDlg.querySelector('p').textContent =
    `Close “${label(t)}”? Its shell and everything running in it will be ended.` +
    (hasChildren(t.id) ? ' The tabs nested in it stay open and move up a level.' : '');
  confirmDlg.returnValue = '';
  confirmDlg.showModal();
  confirmDlg.querySelector('.danger').focus();
  return new Promise(resolve => confirmDlg.addEventListener('close',
    () => resolve(confirmDlg.returnValue === 'ok'), { once: true }));
}

async function closeTab(id) {
  const t = tabs.get(id);
  if (!t || !await confirmClose(t)) {
    tabs.get(activeId)?.term?.focus();
    return;
  }
  await api('/' + id, { method: 'DELETE' }).catch(() => {});
  removeTab(id);
}

// Move tab `id`, with everything nested in it, to just before or after `target` (as
// its sibling), or into it as its first or last child. In this page only; saveOrder()
// sends it to the server. Returns whether anything moved.
function moveSubtree(id, target, where) {
  if (!tabs.has(id) || !tabs.has(target) || id === target || isUnder(target, id)) return false;
  const t = tabs.get(id);
  const was = order.join() + '|' + t.parent;
  const sub = subtree(id);
  const rest = order.filter(x => !sub.includes(x));
  let at;
  if (where === 'before') at = rest.indexOf(target);
  else if (where === 'first') at = rest.indexOf(target) + 1;
  else {
    const ts = subtree(target).filter(x => !sub.includes(x));
    at = rest.indexOf(ts[ts.length - 1]) + 1;
  }
  order = [...rest.slice(0, at), ...sub, ...rest.slice(at)];
  t.parent = where === 'into' || where === 'first' ? target : tabs.get(target).parent;
  if (t.parent === target && collapsed.delete(target)) saveCollapsed();
  if (order.join() + '|' + t.parent === was) return false;
  orderVersion++;
  renderBar();
  return true;
}

// Alt+Shift+PgUp / PgDn: past the previous or next tab at the same level.
function shiftTab(id, d) {
  const sibs = siblings(id), j = sibs.indexOf(id) + d;
  if (j >= 0 && j < sibs.length && moveSubtree(id, sibs[j], d < 0 ? 'before' : 'after')) saveOrder();
}

// Into the tab above it at the same level, or out to just after its parent.
function indent(id) {
  const sibs = siblings(id), i = sibs.indexOf(id);
  if (i > 0 && moveSubtree(id, sibs[i - 1], 'into')) saveOrder();
}

function outdent(id) {
  const p = tabs.get(id)?.parent;
  if (p && moveSubtree(id, p, 'after')) saveOrder();
}

function saveOrder() {
  orderVersion++;
  const parents = Object.fromEntries(order.filter(id => tabs.get(id).parent).map(id => [id, tabs.get(id).parent]));
  api('', { method: 'PUT', body: JSON.stringify({ order, parents }) })
    .catch(() => { statusEl.textContent = 'restart the server to reorder tabs'; });
}

// Drag a tab to move it, along with the tabs nested in it. Over the middle of another
// tab it goes inside that one; near either end, before or after it. Mouse and pen
// only: a finger on the bar scrolls it. The listeners sit on the document, so a drag
// can end anywhere.
function dragTab(t, e) {
  if (e.button !== 0 || e.pointerType === 'touch' || e.target.closest('.close, .twisty, input')) return;
  const vertical = settings.tabs === 'left';
  const pos = ev => vertical ? ev.clientY : ev.clientX;
  const start = pos(e);
  const sub = subtree(t.id);
  let moved = false, drop = null, marked = null;
  // Where the pointer would drop the tab, as moveSubtree() takes it: { id, where }.
  const target = ev => {
    const p = pos(ev);
    const ids = visibleOrder().filter(x => !sub.includes(x));
    if (!ids.length) return null;
    for (const id of ids) {
      const r = tabs.get(id).tabEl.getBoundingClientRect();
      const [a, b] = vertical ? [r.top, r.bottom] : [r.left, r.right];
      if (p < a || p >= b) continue;
      const f = (p - a) / (b - a);
      if (f < .25) return { id, where: 'before' };
      if (f < .75) return { id, where: 'into' };
      // Just past a tab whose children show is the start of those children.
      return ids.some(x => tabs.get(x).parent === id) ? { id, where: 'first' } : { id, where: 'after' };
    }
    const first = tabs.get(ids[0]).tabEl.getBoundingClientRect();
    if (p < (vertical ? first.top : first.left)) return { id: ids[0], where: 'before' };
    const last = tabs.get(ids[ids.length - 1]).tabEl.getBoundingClientRect();
    const top = ids.filter(x => !tabs.get(x).parent).pop();
    return top && p >= (vertical ? last.bottom : last.right) ? { id: top, where: 'after' } : null;
  };
  // The marker: a line where the tab would go, indented to the depth it would have,
  // or a box around the tab it would go into.
  const mark = d => {
    if (marked) {
      marked.el.classList.remove(marked.cls);
      marked.el.style.removeProperty('--drop-depth');
    }
    marked = null;
    drop = d;
    if (!d) return;
    const shown = visibleOrder().filter(x => !sub.includes(x));
    let id = d.id, cls = 'drop-' + d.where, dep = depth(d.id);
    if (d.where === 'first') {
      id = shown.find(x => tabs.get(x).parent === d.id);
      cls = 'drop-before';
      dep++;
    } else if (d.where === 'after') {
      const ts = subtree(d.id).filter(x => shown.includes(x));
      id = ts[ts.length - 1];
    }
    const el = tabs.get(id).tabEl;
    el.classList.add(cls);
    if (cls !== 'drop-into') el.style.setProperty('--drop-depth', dep);
    marked = { el, cls };
  };
  const move = ev => {
    if (!moved) {
      if (Math.abs(pos(ev) - start) < 5) return;
      moved = dragging = true;
      for (const x of sub) tabs.get(x).tabEl.classList.add('dragging');
      document.body.classList.add('dragging-tab');
    }
    const d = target(ev);
    if (d?.id !== drop?.id || d?.where !== drop?.where) mark(d);
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    if (!moved) return;
    dragging = false;
    for (const x of sub) tabs.get(x)?.tabEl.classList.remove('dragging');
    document.body.classList.remove('dragging-tab');
    const d = drop;
    mark(null);
    if (d && tabs.has(t.id) && moveSubtree(t.id, d.id, d.where)) saveOrder();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

function startRename(t) {
  const lab = t.tabEl.querySelector('.label');
  if (!lab) return;
  const input = document.createElement('input');
  input.value = t.name;
  input.placeholder = label(t);
  lab.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    const span = document.createElement('span');
    span.className = 'label';
    input.replaceWith(span);
    if (save && input.value.trim() !== t.name) {
      const r = await api('/' + t.id, { method: 'PATCH', body: JSON.stringify({ name: input.value }) }).catch(() => null);
      if (r) t.name = r.name;
    }
    renderBar();
    t.term?.focus();
  };
  input.addEventListener('keydown', e => {
    // Enter or Escape inside an IME composition (e.g. picking an emoji) belongs to the IME.
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  });
  // An OS emoji picker is a window of its own: focus comes back to the input once
  // it closes, so only a blur within the page ends the rename.
  input.addEventListener('blur', () => { if (document.hasFocus()) finish(true); });
}

// Right-click menu of swatches; the colour is stored on the server, like the name,
// so every browser shows it.
function openColors(t) {
  colorMenu.replaceChildren();
  for (const c of [...COLORS, '']) {
    const b = document.createElement('button');
    b.title = c || 'Automatic (from the name)';
    if (c) b.style.setProperty('--swatch', c); else b.className = 'none';
    b.addEventListener('click', async () => {
      closeColors();
      const r = await api('/' + t.id, { method: 'PATCH', body: JSON.stringify({ color: c }) }).catch(() => null);
      if (r && 'color' in r) t.color = r.color;
      renderBar();
    });
    colorMenu.appendChild(b);
  }
  // Nesting, for touch screens too, where tabs can't be dragged.
  const actions = document.createElement('div');
  actions.className = 'actions';
  const sibs = siblings(t.id);
  for (const [text, keys, enabled, run] of [
    ['New nested tab', 'Alt+Shift+N', true, () => newTab(t.id)],
    ['Indent', 'Alt+Shift+I', sibs.indexOf(t.id) > 0, () => indent(t.id)],
    ['Outdent', 'Alt+Shift+O', !!t.parent, () => outdent(t.id)],
  ]) {
    const b = document.createElement('button');
    b.textContent = text;
    b.title = keys;
    b.disabled = !enabled;
    b.addEventListener('click', () => { closeColors(); run(); });
    actions.appendChild(b);
  }
  colorMenu.appendChild(actions);
  const r = t.tabEl.getBoundingClientRect();
  colorMenu.hidden = false;
  const vertical = settings.tabs === 'left';
  const left = vertical ? r.right + 4 : r.left;
  const top = vertical ? r.top : r.bottom + 4;
  colorMenu.style.left = Math.max(4, Math.min(left, innerWidth - colorMenu.offsetWidth - 4)) + 'px';
  colorMenu.style.top = Math.max(4, Math.min(top, innerHeight - colorMenu.offsetHeight - 4)) + 'px';
}

function closeColors() {
  if (colorMenu.hidden) return;
  colorMenu.hidden = true;
  tabs.get(activeId)?.term?.focus();
}

// Linux and BSD desktops (X11, Wayland) also have PRIMARY, pasted with a middle click.
const HAS_PRIMARY = /Linux|BSD/.test(navigator.platform) && !/Android/.test(navigator.userAgent);

// navigator.clipboard only exists in a secure context (https or localhost); over
// plain http on the LAN, fall back to execCommand on a throwaway textarea.
// PRIMARY has no web API: the browser fills it from a text selection, and Firefox
// skips selections made by script (xterm.js sets one with textarea.select()). It does
// take execCommand('selectAll') in a focused textarea, which it treats as the user's.
function copyText(t, text) {
  if (!text) return;
  const secure = navigator.clipboard && window.isSecureContext;
  if (secure) navigator.clipboard.writeText(text).catch(() => {});
  if (secure && !HAS_PRIMARY) return;
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.readOnly = !HAS_PRIMARY;  // keeps a phone's keyboard from popping up
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  ta.focus();
  try {
    document.execCommand('selectAll');
    if (!secure) document.execCommand('copy');
  } catch {}
  ta.remove();
  t.term.focus();
}

// macOptionIsMeta turns Option+key into Meta, which swallows the ASCII symbols some
// layouts type with Option (@ is Option+2 on Canadian French). Type those as text
// instead; on a US layout Option+letter gives characters like ∫, so those stay Meta.
const isMac = /Mac/.test(navigator.platform);
function optionSymbol(t, e) {
  if (!isMac || e.type !== 'keydown' || !e.altKey || e.ctrlKey || e.metaKey) return true;
  if (!/^[!-\/:-@[-`{-~]$/.test(e.key)) return true;
  t.term.input(e.key);
  e.preventDefault();
  return false;
}

// Alt+Shift shortcuts, matched on e.code so macOS Option symbols don't get in the way.
function shortcut(e) {
  if (e.type === 'keydown' && e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey && e.code === 'KeyC') {
    const t = activeId && tabs.get(activeId);
    if (t?.term?.hasSelection()) copyText(t, t.term.getSelection());
    e.preventDefault();
    return false;
  }
  // Ctrl+K clears the screen and scrollback, like Cmd+K on macOS; the shell never sees it.
  if (e.type === 'keydown' && e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey && e.code === 'KeyK') {
    const t = activeId && tabs.get(activeId);
    t?.term?.clear();
    e.preventDefault();
    return false;
  }
  if (e.type !== 'keydown' || !e.altKey || !e.shiftKey || e.ctrlKey || e.metaKey) return true;
  // Stepping and numbering go by the tabs on show, skipping folded-away ones.
  const vis = visibleOrder();
  const i = vis.indexOf(activeId);
  const go = n => vis.length && activate(vis[(n + vis.length) % vis.length]);
  switch (e.code) {
    case 'KeyT': newTab(); break;
    case 'KeyN': if (activeId) newTab(activeId); break;
    case 'KeyW': if (activeId) closeTab(activeId); break;
    case 'KeyR': if (activeId) startRename(tabs.get(activeId)); break;
    case 'ArrowLeft': case 'BracketLeft': go(i - 1); break;
    case 'ArrowRight': case 'BracketRight': go(i + 1); break;
    case 'PageUp': if (activeId) shiftTab(activeId, -1); break;
    case 'PageDown': if (activeId) shiftTab(activeId, 1); break;
    case 'KeyI': if (activeId) indent(activeId); break;
    case 'KeyO': if (activeId) outdent(activeId); break;
    default:
      if (/^Digit[1-9]$/.test(e.code)) { go(Number(e.code.slice(5)) - 1); break; }
      return true;
  }
  e.preventDefault();
  return false;
}

// Keep the tab list in step with the server, so tabs opened or closed from
// another browser show up here too.
async function sync() {
  let list;
  const version = orderVersion;
  try {
    list = await api('');
    // A server from before tab colours lists none, and saving one would clear the name.
    statusEl.textContent = !list.length ? ''
      : !('color' in list[0]) ? 'restart the server for tab colours'
      : !('parent' in list[0]) ? 'restart the server for nested tabs' : '';
  } catch {
    statusEl.textContent = 'server unreachable';
    return;
  }
  const live = new Set(list.map(x => x.id));
  for (const id of [...tabs.keys()]) if (!live.has(id)) removeTab(id);
  // A move made here while the list was on its way wins over the server's, nesting included.
  const current = !dragging && version === orderVersion;
  for (const info of list) {
    const known = tabs.has(info.id);
    const t = tabs.get(info.id) || makeTab(info);
    t.name = info.name;
    t.color = info.color || '';
    if (current || !known) t.parent = info.parent || '';
  }
  order = treeOrder(current ? list.map(x => x.id)
    : [...order.filter(id => tabs.has(id)), ...list.map(x => x.id).filter(id => !order.includes(id))]);
  if (!activeId && order.length) {
    let saved = null;
    try { saved = localStorage.getItem('xterm-web.active'); } catch {}
    activate(order.includes(saved) ? saved : visibleOrder()[0]);
  }
  renderBar();
}

newBtn.addEventListener('click', newTab);
gearBtn.addEventListener('click', openSettings);
settingsDlg.addEventListener('input', changeSetting);
settingsDlg.addEventListener('close', () => tabs.get(activeId)?.term?.focus());
// Another window of this browser changed them.
window.addEventListener('storage', e => {
  if (e.key === SETTINGS_KEY) { settings = loadSettings(); applySettings(); }
});
for (const dlg of [confirmDlg, settingsDlg])
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
document.addEventListener('mousedown', e => { if (!colorMenu.contains(e.target)) closeColors(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeColors(); }, true);
// For keys typed into a terminal, xterm has already run shortcut() and lets the event
// bubble on, so only handle keys pressed elsewhere on the page.
document.addEventListener('keydown', e => {
  if (!e.target.closest?.('.xterm') && shortcut(e) === false) e.stopPropagation();
});
new ResizeObserver(() => activeId && tabs.get(activeId)?.fit?.fit()).observe(terms);
window.addEventListener('focus', () => {
  const t = activeId && tabs.get(activeId);
  if (t?.term) sendResize(t, t.term.cols, t.term.rows);
});

applySettings();
(async () => {
  await sync();
  if (!order.length) await newTab();
  setInterval(sync, 2000);
})();
</script>
</body>
</html>
